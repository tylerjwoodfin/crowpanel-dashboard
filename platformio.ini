; CrowPanel 5.79" ESP32-S3 E-Ink Hello World
; Uses GxEPD2 with GDEY0579T93 driver (792x272 resolution)

[platformio]
default_envs = boot_test

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
upload_speed = 115200
upload_port = /dev/cu.usbserial-110

; Minimal boot test - NO display, just Serial. Use this to verify ESP32 boots.
; If you see "Boot test OK" in serial monitor, the chip works.
[env:boot_test]
extends = env
board = esp32-s3-devkitc-1
build_flags = 
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DBOOT_TEST

; CrowPanel with display - use after boot_test works
[env:crowpanel]
extends = env
board = esp32-s3-devkitc-1
; 8MB flash - use correct partition table (NOT 16MB!)
board_build.partitions = default_8MB.csv
; CrowPanel has 8MB PSRAM - use OPI
board_build.arduino.memory_type = qio_opi
build_flags = 
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DBOARD_HAS_PSRAM

lib_deps = 
    zinggjm/GxEPD2
    adafruit/Adafruit GFX Library
    bblanchon/ArduinoJson
